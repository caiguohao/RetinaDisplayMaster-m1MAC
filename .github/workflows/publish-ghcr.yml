name: Publish GHCR package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to package
        required: true
        default: v1.2.0
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Download release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p package
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "RetinaDisplayMaster-m1-arm64.zip" \
            --dir package

      - name: Install ORAS
        uses: oras-project/setup-oras@v1

      - name: Publish OCI artifact to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          version="${RELEASE_TAG#v}"
          package="ghcr.io/${GITHUB_REPOSITORY,,}"

          printf '%s' "$GHCR_TOKEN" | oras login ghcr.io \
            --username "$GITHUB_ACTOR" \
            --password-stdin

          oras push "${package}:${version}" \
            --artifact-type "application/vnd.retinadisplaymaster.package.v1+zip" \
            --annotation "org.opencontainers.image.title=Retina Display Master" \
            --annotation "org.opencontainers.image.description=Native arm64 macOS status-bar display mode utility" \
            --annotation "org.opencontainers.image.version=${version}" \
            --annotation "org.opencontainers.image.licenses=GPL-3.0" \
            --annotation "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            "package/RetinaDisplayMaster-m1-arm64.zip:application/zip"

          oras tag "${package}:${version}" latest
